<!doctype html><html lang="fr"><head><meta charset="utf-8"><base href="../"><title>EVOLVE — Vétérans et tourelles</title><link rel="stylesheet" href="style.css"><style>body{overflow:auto;max-width:960px;margin:auto;padding:24px}canvas{width:100%;background:#283340;border-radius:16px}p{margin:16px 0}</style></head><body><h1>Survivre, prendre du grade</h1><p>Recrue → Vétéran (12 s) → Élite (24 s) → Champion (40 s). Grades temporaires, aucun soin à la promotion.</p><canvas id="grades" width="1600" height="480" aria-label="Quatre grades avec taille et insignes progressifs"></canvas><h2>Tourelles peintes</h2><p>Baliste : portée 440 · Piège : 150 · Autel : 360</p><canvas id="turrets" width="1600" height="500" aria-label="Baliste, piège et autel peints"></canvas><p id="status">Chargement…</p><script type="module">
import {loadConfig,config} from './app/core/config.js';import {drawCreature} from './app/render/creature.js';import {drawTurret} from './app/render/buildings.js';import {drawVeteranGrade} from './app/render/veterancy.js';import {updateVeterancy} from './app/core/veterancy.js';import {whenPaintedReady} from './app/render/painted.js';
await loadConfig();await Promise.all([whenPaintedReady('units',5),whenPaintedReady('turrets',0)]);
const g=document.querySelector('#grades').getContext('2d'),t=document.querySelector('#turrets').getContext('2d');g.scale(2,2);t.scale(2,2);
for(const [i,age] of [0,12,24,40].entries()){const u={sizeMult:1,interval:1,cd:.5,hp:100};updateVeterancy(u,age,config.battle.veterancy);const size=100*u.sizeMult,p={px:100+200*i,py:180};drawCreature(g,{stage:5},{painted:true,x:p.px,y:p.py,size,archetype:'brute'});drawVeteranGrade(g,u,p,size,config.battle.veterancy);g.font='bold 16px sans-serif';g.textAlign='center';g.fillStyle='#F4F1E8';g.fillText(['Recrue','Vétéran','Élite','Champion'][i],p.px,220);}
for(const [i,shape] of ['baliste','machoire','autel'].entries())drawTurret(t,{x:130+i*270,y:220,s:80,shape,fire:0,level:1});document.querySelector('#status').textContent='4 grades et 3 tourelles chargés.';
</script></body></html>
