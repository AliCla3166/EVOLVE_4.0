<!doctype html><html lang="fr"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVOLVE — Anatomie vivante</title><link rel="stylesheet" href="style.css"><style>body{overflow:auto;max-width:1000px;padding:24px;margin:auto}.lab{display:grid;grid-template-columns:1fr 300px;gap:20px}#creature{width:100%;height:400px;border:3px solid #111b25;border-radius:18px;background:#152b35}label{display:block;margin:12px 0}button{margin:4px}.samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.samples canvas{width:100%;background:#172c37;border-radius:12px}.samples figure{margin:0;font-size:12px;text-align:center}@media(max-width:700px){.lab{grid-template-columns:1fr}#creature{height:320px}}</style></head><body><h1>Anatomie vivante · Cellule</h1><p>Sept mutations combinables, avec les mêmes pièces peintes que dans Espèce. Cet atelier ne modifie pas ta sauvegarde.</p><div class="lab"><canvas id="creature" aria-label="Cellule évolutive animée"></canvas><div id="choices"><button class="chip" id="all">Tous les traits</button><button class="chip" id="none">Forme initiale</button></div></div><p id="results" role="status">Vérification…</p><h2>Chaque mutation isolée</h2><div id="samples" class="samples"></div><script type="module" src="tools/anatomy-preview.js"></script></body></html>
